<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>指尖花开 | Three.js + MediaPipe 手势粒子交互</title>
  <link rel="stylesheet" href="./style.css" />

  <!-- MediaPipe Hands 与绘图工具库 (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>

  <!-- Three.js ES Module Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <!-- 底层：摄像头视频画面与手部骨骼 Canvas 叠加层 -->
  <div id="camera-container">
    <video id="webcam-video" playsinline muted></video>
    <canvas id="landmark-canvas"></canvas>
  </div>

  <!-- 中层：Three.js 3D 粒子渲染容器 -->
  <div id="webgl-container"></div>

  <!-- 顶层：左上角状态与数据监控面板 -->
  <div id="hud-panel" class="glass-panel">
    <div class="panel-header">
      <span class="status-dot" id="status-dot"></span>
      <h1 class="panel-title">指尖花开 · 实时粒子交互</h1>
    </div>
    <p id="status-text" class="status-desc">正在初始化摄像头与 AI 手势模型...</p>

    <!-- 实时张开度与绽放度进度条 -->
    <div class="metrics-group">
      <div class="metric-row">
        <div class="metric-label">
          <span>手掌张开度 (Tension)</span>
          <span id="tension-value">0.00</span>
        </div>
        <div class="progress-bar">
          <!-- 0.32 与 0.66 阈值刻度线 -->
          <div class="threshold-marker" style="left: 32%;" title="闭合阈值 0.32"></div>
          <div class="threshold-marker" style="left: 66%;" title="绽放阈值 0.66"></div>
          <div class="progress-fill" id="tension-bar"></div>
        </div>
      </div>

      <div class="metric-row">
        <div class="metric-label">
          <span>花朵绽放度 (Spread)</span>
          <span id="spread-value">0.00</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill spread-fill" id="spread-bar"></div>
        </div>
      </div>

      <div class="gesture-badge-row">
        <span>当前状态：</span>
        <span id="gesture-state-badge" class="badge">等待手部入画</span>
      </div>
    </div>

    <!-- 参数可调控制区 -->
    <div class="controls-group">
      <div class="control-item">
        <label for="particle-count-slider">
          <span>粒子数量</span>
          <span id="particle-count-val">15000</span>
        </label>
        <input type="range" id="particle-count-slider" min="5000" max="20000" step="1000" value="15000" />
      </div>

      <div class="control-item">
        <label for="petal-count-slider">
          <span>花瓣数量 (极坐标阶数)</span>
          <span id="petal-count-val">6</span>
        </label>
        <input type="range" id="petal-count-slider" min="3" max="10" step="1" value="6" />
      </div>

      <div class="control-item">
        <label for="video-opacity-slider">
          <span>摄像头背景透明度</span>
          <span id="video-opacity-val">35%</span>
        </label>
        <input type="range" id="video-opacity-slider" min="0" max="100" step="5" value="35" />
      </div>

      <div class="control-toggles">
        <label class="checkbox-label">
          <input type="checkbox" id="toggle-skeleton" checked />
          <span>显示 21 点手部骨骼连线</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="toggle-manual" />
          <span>手动模拟模式 (免摄像头调试)</span>
        </label>
      </div>

      <div class="control-item hidden" id="manual-slider-wrapper">
        <label for="manual-tension-slider">
          <span>手动模拟 Tension</span>
          <span id="manual-tension-val">0.00</span>
        </label>
        <input type="range" id="manual-tension-slider" min="0" max="1" step="0.01" value="0" />
      </div>
    </div>
  </div>

  <!-- 摄像头权限/错误提示浮层 -->
  <div id="error-modal" class="modal hidden">
    <div class="modal-content glass-panel">
      <h2>⚠️ 无法访问摄像头</h2>
      <p id="error-message">请检查浏览器摄像头权限设置，或确认设备已连接摄像头。</p>
      <ul class="error-tips">
        <li>请确保通过 <code>http://localhost</code> 或 <code>https://</code> 访问本页面。</li>
        <li>若浏览器地址栏左侧有权限锁图标，请将“摄像头”设为“允许”并刷新。</li>
        <li>如果您当前没有摄像头，可点击下方按钮开启<strong>手动交互模式</strong>体验花朵绽放。</li>
      </ul>
      <div class="modal-actions">
        <button id="retry-camera-btn" class="btn primary-btn">重新请求摄像头</button>
        <button id="use-manual-btn" class="btn secondary-btn">使用鼠标/滑块模拟模式</button>
      </div>
    </div>
  </div>

  <!-- 主逻辑脚本 -->
  <script type="module" src="./main.js"></script>
</body>
</html>
